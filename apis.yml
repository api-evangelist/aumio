name: Aumio
description: 'Aumio (Aumio GmbH) is a Berlin-based children''s digital-health company behind a
  freemium sleep, meditation, and mindfulness mobile app for kids aged roughly 0-10 and their families.
  The app offers 200+ audio experiences - bedtime stories, soundscapes, white noise, sleep music, and
  guided meditations - added to weekly, with parts of the subscription reimbursed by German statutory
  health-insurance providers as a certified prevention course. Founded in 2020 and backed by Partech,
  Aumio operates as a consumer B2C product (iOS, Android, and web) and publishes no public developer
  API, SDK, or documentation surface; this API Evangelist profile captures its public web and domain
  footprint.'
